# Yazi theme — ANSI-only overlay on Yazi's built-in light/dark preset
# (picked from the terminal mode). ratatui names: gray = ANSI 7 (= Zenwritten
# fg), darkgray = 8 (dim grey), white = 15 (mid grey), black = 0 (= background).
# Schema: https://yazi-rs.github.io/docs/configuration/theme

[mgr]
cwd           = { fg = "blue", bold = true }
find_keyword  = { fg = "yellow", bold = true }
find_position = { fg = "magenta", bg = "reset" }
border_style  = { fg = "darkgray" }
count_copied   = { fg = "black", bg = "green" }
count_cut      = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "yellow" }

[tabs]
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "white", bg = "reset" }

[mode]
normal_main = { fg = "black", bg = "blue", bold = true }
normal_alt  = { fg = "blue", bg = "reset" }
select_main = { fg = "black", bg = "red", bold = true }
select_alt  = { fg = "red", bg = "reset" }
unset_main  = { fg = "black", bg = "red", bold = true }
unset_alt   = { fg = "red", bg = "reset" }

[status]
perm_sep        = { fg = "darkgray" }
progress_normal = { fg = "black", bg = "blue" }
progress_error  = { fg = "black", bg = "red" }

[which]
rest            = { fg = "white" }
separator_style = { fg = "darkgray" }

[filetype]
rules = [
    { url = "*", is = "orphan", fg = "red" },
    { url = "*", is = "exec", fg = "green" },
    { url = "*/", fg = "blue", bold = true },
]
