set -g prefix C-a
unbind C-b

# Core settings
set -s escape-time 10
set -s focus-events on
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g display-time 2000

# Terminal colors
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-features ',xterm-256color:usstyle'
set -as terminal-features ',xterm-ghostty:usstyle'

# Status bar — ANSI slots only (0 = bg, 7 = fg, 8 = dim grey, 15 = secondary)
set-option -g status-position top
set -g status-style 'bg=default,fg=colour15'
set -g status-left '#[fg=colour4,bold]#S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=colour15]%H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=colour7,bold] #I:#W #[default]'
setw -g window-status-activity-style 'fg=colour3'
set -g message-style 'bg=default,fg=colour7'

# Copy/selection mode highlighting
set -g mode-style 'bg=colour8,fg=colour7'

# Pane borders
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour15'
set -g pane-border-indicators colour

# No window-style/window-active-style: with no colour set inside tmux it
# forwards OSC 11 background queries (lazygit/yazi light detection) upstream.
# Unset explicitly so re-sourcing on a running server drops any old value.
set -gu window-style
set -gu window-active-style

# Activity
setw -g monitor-activity on
set -g visual-activity off

# Sessionizer (fuzzy project switcher)
bind-key f display-popup -E "~/.local/bin/tmux-sessionizer"

# Smart-splits navigation (seamless nvim/tmux with @pane-is-vim variable)
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# TPM & plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @open-S 'https://www.duckduckgo.com/'
set -g @continuum-restore 'on'

# Auto-install TPM if missing, then load it
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'
run-shell '[ -d ~/.tmux/plugins/tmux-sensible ] || ~/.tmux/plugins/tpm/bin/install_plugins'
run-shell -b '~/.tmux/plugins/tpm/tpm'
