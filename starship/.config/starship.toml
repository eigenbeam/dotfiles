# Starship prompt configuration
# Docs: https://starship.rs/config/
# Theme: Gruvbox Dark

command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$java\
$lua\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[>](bold #ebdbb2)'
error_symbol = '[>](bold #fb4934)'

[directory]
style = 'bold #83a598'
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = 'bold #b8bb26'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = '#fb4934'
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = '#d3869b'
format = '[$duration]($style) '

[python]
style = '#d3869b'
format = '[$symbol$version]($style) '

[nodejs]
style = '#d3869b'
format = '[$symbol$version]($style) '

[java]
style = '#d3869b'
format = '[$symbol$version]($style) '

[lua]
style = '#d3869b'
format = '[$symbol$version]($style) '

[terraform]
style = '#d3869b'
format = '[$symbol$version]($style) '

[docker_context]
style = '#d3869b'
format = '[$symbol$context]($style) '
