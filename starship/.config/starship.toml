# Starship prompt configuration
# Docs: https://starship.rs/config/
# ANSI colour names only; the terminal palette is the theme.
# Zenwritten slots: bright-white = 15 (secondary grey), bright-black = 8 (faint).

# Caps the damage from any single slow module (git_status in huge repos).
command_timeout = 500
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[>](bold)'
error_symbol = '[>](bold red)'

[directory]
style = 'bold blue'
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = 'bright-white'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = 'red'
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = 'bright-white'
format = '[$duration]($style) '

# Active virtualenv name only: no version, no snake.
[python]
style = 'bright-white'
format = '[(\($virtualenv\) )]($style)'
