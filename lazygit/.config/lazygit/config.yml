# Lazygit configuration — ANSI names only; colours come from the terminal palette.
# Avoid white (= ANSI 15 mid grey) and black (= ANSI 0, the background).
# Light/dark is detected from the terminal (gui.colorScheme: auto); set
# colorScheme: light if that fails inside tmux.
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor: [blue, bold]
    inactiveBorderColor: [default]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: [default] # bold-only selection, no bar
    inactiveViewSelectedLineBgColor: [default]
    cherryPickedCommitFgColor: [magenta]
    cherryPickedCommitBgColor: [default]
    markedBaseCommitFgColor: [magenta]
    markedBaseCommitBgColor: [default]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
